<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Gochi+Hand&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:#F7F7F6;background-image:radial-gradient(#D9D9D5 1.4px,transparent 1.5px);background-size:22px 22px;font-family:Figtree,sans-serif;color:#111;position:relative}
.left{position:absolute;left:64px;top:72px;width:560px}
.tape{display:inline-block;background:#fff;border:2px solid #111;padding:4px 22px 8px;font-family:"Gochi Hand";font-size:68px;line-height:1;box-shadow:4px 5px 0 #111;position:relative}
.t1{transform:rotate(-2.5deg)}
.t2{transform:rotate(1.8deg);margin:22px 0 0 54px;background:#111;color:#fff}
.tape::before{content:"";position:absolute;top:-14px;left:50%;width:70px;height:24px;margin-left:-35px;background:rgba(232,64,42,.25);transform:rotate(-4deg)}
.sub{margin-top:44px;font-size:25px;font-weight:500;line-height:1.35;width:520px}
.sub em{font-family:"Instrument Serif";font-size:30px;font-weight:400}
.pill{display:inline-block;margin-top:20px;background:#EDEDEB;border-radius:999px;padding:8px 18px;font-size:16px;font-weight:700;color:#6E6E6B}
.dog{position:absolute;right:36px;top:30px;width:430px;height:430px;border-radius:50%;overflow:hidden}
.dog img{width:100%;height:100%}
.cloud{position:absolute;right:360px;top:36px;font-family:"Gochi Hand";font-size:30px;background:#F1F1EF;border:2px solid #E4E4E1;border-radius:24px;padding:6px 18px;transform:rotate(-4deg)}
</style></head><body>
<div class="left">
 <div class="tape t1">You spot it.</div><br>
 <div class="tape t2">We fetch it.</div>
 <div class="sub">Snap it, and Scout finds it and pays with PayPal, <em>only within the house rules you set.</em></div>
 <div class="pill">PayPal sandbox demo · no real money</div>
</div>
<div class="dog"><img src="icon-512.png"></div>
<div class="cloud">woof! found it</div>
</body></html>
